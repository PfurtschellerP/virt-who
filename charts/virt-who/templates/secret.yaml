{{- if not .Values.rhsm.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "virt-who.secretName" . }}
  labels:
    {{- include "virt-who.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.rhsm.usernameKey }}: {{ required "rhsm.username is required (or set rhsm.existingSecret)" .Values.rhsm.username | quote }}
  {{ .Values.rhsm.passwordKey }}: {{ required "rhsm.password is required (or set rhsm.existingSecret)" .Values.rhsm.password | quote }}
{{- end }}
