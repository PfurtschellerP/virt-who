apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "virt-who.fullname" . }}
  labels:
    {{- include "virt-who.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "virt-who.selectorLabels" . | nindent 6 }}
  {{- with .Values.updateStrategy }}
  updateStrategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  template:
    metadata:
      annotations:
        {{- if not .Values.rhsm.existingSecret }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "virt-who.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if or .Values.computeNodeLabel .Values.podAffinity .Values.podAntiAffinity }}
      affinity:
        {{- with .Values.podAffinity }}
        podAffinity:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.podAntiAffinity }}
        podAntiAffinity:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.computeNodeLabel }}
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: {{ . | quote }}
                    operator: Exists
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: virt-who
          image: {{ include "virt-who.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: SATELLITE_ORG
              value: {{ required "satellite.organization is required" .Values.satellite.organization | quote }}
            - name: SATELLITE_HOST
              value: {{ required "satellite.host is required" .Values.satellite.host | quote }}
            - name: SATELLITE_PORT
              value: {{ .Values.satellite.port | quote }}
            - name: SATELLITE_PREFIX
              value: {{ .Values.satellite.prefix | quote }}
            - name: RHSM_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "virt-who.secretName" . }}
                  key: {{ .Values.rhsm.usernameKey }}
            - name: RHSM_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "virt-who.secretName" . }}
                  key: {{ .Values.rhsm.passwordKey }}
            - name: HYPERVISOR_ID
              value: {{ .Values.virtWho.hypervisorId | quote }}
            - name: LIBVIRT_SERVER
              value: {{ .Values.virtWho.libvirtServer | quote }}
            - name: VIRTWHO_INTERVAL_SECONDS
              value: {{ .Values.virtWho.intervalSeconds | quote }}
            - name: VIRTWHO_DEBUG
              value: {{ .Values.virtWho.debug | ternary "1" "0" | quote }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            # /run holds the rendered config (/run/virt-who) and the PID file.
            - name: run
              mountPath: /run
            - name: libvirt-socket
              mountPath: /run/libvirt
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: rhsm-log
              mountPath: /var/log/rhsm
            - name: virt-who-state
              mountPath: /var/lib/virt-who
            {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: run
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
        - name: libvirt-socket
          hostPath:
            path: {{ .Values.libvirtSocketDir | quote }}
            type: Directory
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        # virt-who always writes rhsm.log in addition to stdout; the file is
        # not rotated, so cap its size.
        - name: rhsm-log
          emptyDir:
            sizeLimit: 128Mi
        - name: virt-who-state
          emptyDir:
            sizeLimit: 16Mi
        {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
