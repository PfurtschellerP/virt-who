name: Question
description: Ask how to use or configure the image or the Helm chart.
labels:
  - question
body:
  - type: markdown
    attributes:
      value: |
        Please check the [README](https://github.com/PfurtschellerP/virt-who#readme) and the [chart README](https://github.com/PfurtschellerP/virt-who/blob/main/charts/virt-who/README.md) first.
        **Do not paste credentials.**

  - type: textarea
    id: question
    attributes:
      label: Question
      description: What would you like to know? Include your deployment method and versions if relevant.
    validations:
      required: true
