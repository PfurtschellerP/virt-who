name: Feature request
description: Suggest an improvement to the image, the Helm chart or the tooling.
labels:
  - enhancement
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Container image
        - Helm chart
        - Docker / Podman Compose example
        - Release tooling or CI
        - Documentation
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what makes it hard today?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How should it work? For chart changes, an example of the values you would set helps.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds or other approaches you have tried.

  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I would like to open a pull request for this (see CONTRIBUTING.md).
