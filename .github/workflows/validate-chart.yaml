name: Validate Helm chart

on:
  pull_request:
    branches:
      - main
    paths:
      - charts/**
      - .github/workflows/validate-chart.yaml
      - .github/workflows/publish-chart.yaml
  push:
    branches:
      - main
    paths:
      - charts/**
      - .github/workflows/validate-chart.yaml
      - .github/workflows/publish-chart.yaml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@59b1c81c6280f5abebb1fb1bc585696daa7dfb42 # v5.0.0

      - name: Lint chart
        run: helm lint ./charts/virt-who

      - name: Render chart
        run: |
          helm template virt-who ./charts/virt-who \
            --set satellite.organization=example \
            --set satellite.host=satellite.example.com \
            --set rhsm.username=reporter \
            --set rhsm.password=not-a-real-password
