name: Create GitHub release

# Called by the publish workflows once an artifact has been published
# successfully. Can also be run manually to (re-)create a missing release.
on:
  workflow_call:
    inputs:
      tag:
        description: Release tag (image-v<version> or chart-v<version>)
        required: true
        type: string
      artifact:
        description: Published artifact reference
        required: false
        type: string
        default: ""
      digest:
        description: Digest of the published artifact
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      tag:
        description: Existing image-v* or chart-v* tag to release
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    name: Create release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          ARTIFACT: ${{ inputs.artifact }}
          DIGEST: ${{ inputs.digest }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"

          case "$TAG" in
            image-v*)
              version="${TAG#image-v}"
              title="Container image v${version}"
              artifact="${ARTIFACT:-ghcr.io/${GITHUB_REPOSITORY,,}:${version}}"
              usage="docker pull ${artifact}"
              ;;
            chart-v*)
              version="${TAG#chart-v}"
              title="Helm chart v${version}"
              artifact="${ARTIFACT:-oci://ghcr.io/${owner}/charts/virt-who --version ${version}}"
              usage="helm upgrade --install virt-who ${artifact}"
              ;;
            *)
              echo "::error::Unsupported release tag: ${TAG}"
              exit 1
              ;;
          esac

          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag ${TAG} must contain a valid semantic version"
            exit 1
          fi

          notes="$(mktemp)"
          {
            echo '```sh'
            echo "$usage"
            echo '```'
            if [[ -n "$DIGEST" ]]; then
              echo
              echo "Digest: \`${DIGEST}\`"
            fi
            echo
            echo "Signatures can be verified with [\`cosign.pub\`](https://github.com/${GITHUB_REPOSITORY}/blob/main/cosign.pub)."
          } > "$notes"

          # Only compare against previous releases of the same artifact.
          previous="$(gh api "repos/${GITHUB_REPOSITORY}/tags" --paginate --jq '.[].name' \
            | grep "^${TAG%%-v*}-v" | grep -vx "$TAG" | sort -V | tail -n 1 || true)"

          args=("$TAG" --verify-tag --title "$title" --notes-file "$notes" --generate-notes)
          if [[ -n "$previous" ]]; then
            args+=(--notes-start-tag "$previous")
          fi
          if [[ "$version" == *-* ]]; then
            args+=(--prerelease)
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists, nothing to do"
          else
            gh release create "${args[@]}"
          fi
