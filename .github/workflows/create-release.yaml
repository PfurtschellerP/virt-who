name: Create GitHub release

on:
  push:
    tags:
      - "image-v*"
      - "chart-virt-who-v*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Determine release details
        id: release
        env:
          REF_NAME: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          case "$REF_NAME" in
            image-v*)
              version="${REF_NAME#image-v}"
              title="Container image v${version}"
              artifact="ghcr.io/${REPOSITORY,,}:${version}"
              ;;
            chart-virt-who-v*)
              version="${REF_NAME#chart-virt-who-v}"
              title="Helm chart v${version}"
              artifact="oci://ghcr.io/${REPOSITORY,,}/virt-who (version ${version})"
              ;;
            *)
              echo "Unsupported release tag: ${REF_NAME}" >&2
              exit 1
              ;;
          esac

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag ${REF_NAME} must contain a valid semantic version" >&2
            exit 1
          fi

          prerelease=false
          if [[ "$version" == *-alpha* ||
                "$version" == *-beta* ||
                "$version" == *-rc* ]]; then
            prerelease=true
          fi

          {
            echo "title=${title}"
            echo "artifact=${artifact}"
            echo "prerelease=${prerelease}"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TITLE: ${{ steps.release.outputs.title }}
          ARTIFACT: ${{ steps.release.outputs.artifact }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          set -euo pipefail
          args=(
            "$GITHUB_REF_NAME"
            --verify-tag
            --title "$RELEASE_TITLE"
            --generate-notes
            --notes "Published artifact: \`${ARTIFACT}\`"
          )
          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}"
