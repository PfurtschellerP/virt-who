name: Publish Helm chart

on:
  push:
    tags:
      - "chart-v*"

permissions:
  contents: read

env:
  # Runners ship podman too; images are built and loaded with Docker Buildx.
  CONTAINER_ENGINE: docker

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Package and publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ github.ref_name }}
      version: ${{ steps.version.outputs.version }}
      chart: ${{ steps.version.outputs.chart }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Determine chart version
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${REF_NAME#chart-v}"
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag ${REF_NAME} must be chart-v<semver>"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Release tags must point to a commit on main"
            exit 1
          fi
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          {
            echo "version=${version}"
            echo "registry=oci://ghcr.io/${owner}/charts"
            echo "chart=ghcr.io/${owner}/charts/virt-who"
            echo "image=ghcr.io/${GITHUB_REPOSITORY,,}"
            echo "app_version=$(sed -n 's/^appVersion: *"\{0,1\}\([^"]*\)"\{0,1\} *$/\1/p' charts/virt-who/Chart.yaml)"
          } >> "$GITHUB_OUTPUT"

      - name: Set up just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.0

      - name: Lint, render and validate chart
        run: just chart-test

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to GitHub Container Registry (Helm)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GITHUB_TOKEN" | helm registry login ghcr.io \
            --username "$GITHUB_ACTOR" --password-stdin

      - name: Check release preconditions
        env:
          CHART: ${{ steps.version.outputs.chart }}
          VERSION: ${{ steps.version.outputs.version }}
          IMAGE: ${{ steps.version.outputs.image }}
          APP_VERSION: ${{ steps.version.outputs.app_version }}
        run: |
          set -euo pipefail
          if ! docker buildx imagetools inspect "${IMAGE}:${APP_VERSION}" >/dev/null 2>&1; then
            echo "::error::appVersion ${APP_VERSION} references ${IMAGE}:${APP_VERSION}, which does not exist"
            exit 1
          fi
          if helm show chart "oci://${CHART}" --version "$VERSION" >/dev/null 2>&1; then
            echo "::error::Chart ${CHART}:${VERSION} already exists; released versions are immutable"
            exit 1
          fi

      - name: Package chart
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: helm package ./charts/virt-who --version "$VERSION" --destination ./dist

      - name: Publish chart
        id: push
        env:
          VERSION: ${{ steps.version.outputs.version }}
          REGISTRY: ${{ steps.version.outputs.registry }}
        run: |
          set -euo pipefail
          output="$(helm push "./dist/virt-who-${VERSION}.tgz" "$REGISTRY" 2>&1)"
          echo "$output"
          digest="$(sed -n 's/^Digest: *\(sha256:[a-f0-9]\{64\}\)$/\1/p' <<<"$output")"
          test -n "$digest" || {
            echo "::error::Could not determine the chart digest"
            exit 1
          }
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Install Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v3.9.0

      - name: Sign chart
        env:
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          CHART: ${{ steps.version.outputs.chart }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          test -n "$COSIGN_PRIVATE_KEY" || {
            echo "::error::COSIGN_PRIVATE_KEY repository secret is not configured"
            exit 1
          }
          cosign sign --yes --key env://COSIGN_PRIVATE_KEY "${CHART}@${DIGEST}"

      - name: Summary
        env:
          CHART: ${{ steps.version.outputs.chart }}
          VERSION: ${{ steps.version.outputs.version }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo "### Published Helm chart"
            echo
            echo "\`oci://${CHART}\` version \`${VERSION}\` (digest \`${DIGEST}\`)"
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: GitHub release
    needs: publish
    permissions:
      contents: write
    uses: ./.github/workflows/create-release.yaml
    with:
      tag: ${{ needs.publish.outputs.tag }}
      artifact: oci://${{ needs.publish.outputs.chart }} --version ${{ needs.publish.outputs.version }}
      digest: ${{ needs.publish.outputs.digest }}
    secrets:
      COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
      COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
