name: Publish Helm chart

on:
  push:
    tags:
      - "chart-v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.0

      - name: Determine chart version
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${REF_NAME#chart-v}"
          if [[ "$version" == "$REF_NAME" ]] || \
             [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag ${REF_NAME} must contain a valid semantic version" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Lint chart
        run: helm lint ./charts/virt-who

      - name: Package chart
        run: |
          set -euo pipefail
          mkdir -p ./dist
          helm package ./charts/virt-who \
            --version "${{ steps.version.outputs.version }}" \
            --destination ./dist

      - name: Log in to GitHub Container Registry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GITHUB_TOKEN" | helm registry login ghcr.io \
            --username "$GITHUB_ACTOR" \
            --password-stdin

      - name: Publish chart
        run: |
          set -euo pipefail
          chart="./dist/virt-who-${{ steps.version.outputs.version }}.tgz"
          test -f "$chart"
          helm push "$chart" "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
